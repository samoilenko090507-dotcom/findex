[project]
name = "findex"
version = "0.4.0"
description = "Inverted index and ranked search engine CLI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
]

[project.scripts]
findex = "findex.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "hypothesis>=6.100.0",
    "pyright>=1.1.350",
    "ruff>=0.4.0",
]

[tool.pyright]
typeCheckingMode = "standard"
include = ["src/findex"]
exclude = ["tests", "src/findex/benchmark*.py", "src/findex/test_corpus.py", "src/findex/download_data.py"]
reportUnknownVariableType = "none"
reportUnknownMemberType = "none"
reportUnknownArgumentType = "none"
reportUnknownParameterType = "none"
reportMissingParameterType = "none"
reportDeprecated = "none"
reportPrivateUsage = "none"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow",
]